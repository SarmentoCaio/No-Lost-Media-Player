<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmulatorJS</title>
    <style>
      html, body, #game { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050609; }
      body { font-family: system-ui, sans-serif; color: #d9dce6; }
      #fatal { box-sizing: border-box; display: none; place-content: center; width: 100%; height: 100%; padding: 2rem; text-align: center; }
      #fatal strong { display: block; margin-bottom: .5rem; color: #ff8b8b; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="fatal" role="alert"></div>
    <script>
      (() => {
        "use strict";

        const notify = (type, message, data = {}, transfer = []) => {
          window.parent.postMessage(
            { source: "no-lost-emulator", type, message, ...data },
            window.location.origin,
            transfer,
          );
        };

        const fail = (message) => {
          const game = document.getElementById("game");
          const fatal = document.getElementById("fatal");
          game.style.display = "none";
          fatal.style.display = "grid";
          fatal.innerHTML = "<div><strong>Falha ao iniciar o emulador</strong><span></span></div>";
          fatal.querySelector("span").textContent = message;
          notify("error", message);
        };

        const params = new URLSearchParams(window.location.search);
        let core = params.get("core");
        const rom = params.get("rom");
        const name = params.get("name") || "Jogo";

        if (!core || !rom) {
          fail("Os parâmetros do emulador estão incompletos.");
          return;
        }

        // Mupen64Plus requer WebGL 2. ParaLLEl é a alternativa para GPUs/drivers
        // que só oferecem WebGL 1 e que, de outra forma, exibiriam apenas uma tela preta.
        if (core === "mupen64plus_next") {
          const supportsWebGl2 = Boolean(document.createElement("canvas").getContext("webgl2"));
          if (!supportsWebGl2) {
            core = "parallel_n64";
            notify("loading", "Usando o núcleo N64 de compatibilidade…");
          }
        }

        window.addEventListener("message", (event) => {
          if (event.source !== window.parent || event.origin !== window.location.origin) return;
          const data = event.data;
          if (data?.source !== "no-lost-player" || typeof data.requestId !== "string") return;

          try {
            const gameManager = window.EJS_emulator?.gameManager;
            if (!gameManager) throw new Error("Aguarde o jogo terminar de iniciar.");

            if (data.type === "export-state") {
              if (!gameManager.supportsStates()) throw new Error("Este núcleo não oferece salvamento de estado.");
              const state = gameManager.getState();
              const stateBuffer = state instanceof Uint8Array
                ? state.slice().buffer
                : new Uint8Array(state).slice().buffer;
              notify("state-exported", "Estado exportado", { requestId: data.requestId, state: stateBuffer }, [stateBuffer]);
            } else if (data.type === "import-state") {
              if (!(data.state instanceof ArrayBuffer)) throw new Error("O arquivo de salvamento é inválido.");
              gameManager.loadState(new Uint8Array(data.state));
              notify("state-imported", "Estado carregado", { requestId: data.requestId });
            }
          } catch (error) {
            notify(
              "state-error",
              error instanceof Error ? error.message : "Falha ao acessar o salvamento.",
              { requestId: data.requestId },
            );
          }
        });

        window.addEventListener("error", (event) => {
          if (event.message) fail("O EmulatorJS encontrou um erro ao carregar o jogo.");
        });
        window.addEventListener("unhandledrejection", () => {
          fail("A ROM não pôde ser carregada ou seu formato não é suportado.");
        });

        const verifyRemoteRom = async () => {
          if (!/^https?:/i.test(rom)) return;
          notify("loading", "Verificando acesso à ROM…");
          const controller = new AbortController();
          try {
            const response = await fetch(rom, {
              method: "GET",
              headers: { Range: "bytes=0-0" },
              signal: controller.signal,
            });
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
          } catch (error) {
            if (error instanceof Error && /^HTTP /.test(error.message)) {
              throw new Error(`A URL da ROM respondeu com erro ${error.message.replace("HTTP ", "")}.`);
            }
            throw new Error("O servidor da ROM não permite carregamento por outro domínio.");
          } finally {
            controller.abort();
          }
        };

        const start = async () => {
          try {
            await verifyRemoteRom();
          } catch (error) {
            fail(error instanceof Error ? error.message : "Não foi possível acessar a URL da ROM.");
            return;
          }

          notify("loading", "Carregando EmulatorJS…");
          window.EJS_player = "#game";
          window.EJS_core = core;
          window.EJS_gameUrl = rom;
          window.EJS_gameName = name;
          // Fixar a versão evita que uma atualização do CDN quebre os cores em produção.
          window.EJS_pathtodata = "https://cdn.emulatorjs.org/4.2.3/data/";
          window.EJS_startOnLoaded = true;
          window.EJS_backgroundColor = "#050609";
          window.EJS_color = "#8b6cff";
          window.EJS_onGameStart = () => notify("ready", "Jogo iniciado");

          const loader = document.createElement("script");
          loader.src = `${window.EJS_pathtodata}loader.js`;
          loader.async = true;
          loader.onload = () => {
            notify("loading", "Runtime carregado. Iniciando o jogo…");
          };
          loader.onerror = () => {
            fail("Não foi possível baixar o EmulatorJS. Verifique sua conexão com a internet.");
          };
          document.body.appendChild(loader);
        };

        start();
      })();
    </script>
  </body>
</html>
