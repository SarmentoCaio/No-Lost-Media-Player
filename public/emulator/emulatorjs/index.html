<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://cdn.emulatorjs.org" crossorigin />
    <title>EmulatorJS</title>
    <style>
      html, body, #game { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050609; }
      body { font-family: system-ui, sans-serif; color: #d9dce6; }
      #fatal { box-sizing: border-box; display: none; place-content: center; width: 100%; height: 100%; padding: 2rem; text-align: center; }
      #fatal strong { display: block; margin-bottom: .5rem; color: #ff8b8b; }
      /* O touch é controlado pela aplicação. A barra nativa permanece disponível
         ao mover o mouse porque concentra cheats e ajustes avançados do core. */
      .ejs_virtualGamepad_parent { display: none !important; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="fatal" role="alert"></div>
    <script>
      (() => {
        "use strict";

        const notify = (type, message, data = {}, transfer = []) => {
          window.parent.postMessage(
            { source: "no-lost-emulator", type, message, ...data },
            window.location.origin,
            transfer,
          );
        };

        const fail = (message) => {
          const game = document.getElementById("game");
          const fatal = document.getElementById("fatal");
          game.style.display = "none";
          fatal.style.display = "grid";
          fatal.innerHTML = "<div><strong>Falha ao iniciar o emulador</strong><span></span></div>";
          fatal.querySelector("span").textContent = message;
          notify("error", message);
        };

        const params = new URLSearchParams(window.location.search);
        let core = params.get("core");
        let rom = params.get("rom");
        const name = params.get("name") || "Jogo";
        const gameId = Number(params.get("gameId"));
        const netplayServer = params.get("netplayServer");
        let shuttingDown = false;
        let pausedInBackground = false;
        let desiredVolume = 0.8;
        let externalInputEnabled = false;
        let externalKeyboardCodes = new Set();
        const masterVolumeGains = new Set();
        let loadingProgress = 0;

        // O loader do EmulatorJS mostra o progresso real dentro de #game, mas
        // a interface externa cobre esse elemento. Espelhamos as fases para o
        // React, mantendo uma porcentagem geral monotônica: runtime, núcleo e ROM.
        const loadingObserver = new MutationObserver(() => {
          const game = document.getElementById("game");
          const text = game?.querySelector(".ejs_loading_text")?.textContent?.replace(/\s+/g, " ").trim() ?? "";
          if (!text) return;
          const matches = [...text.matchAll(/(\d{1,3})\s*%/g)];
          const raw = Math.min(100, Number(matches.at(-1)?.[1] ?? NaN));
          if (!Number.isFinite(raw)) return;

          let overall = 8 + Math.round(raw * 0.84);
          if (/(emulador|emulator|núcleo|core)/i.test(text)) overall = 8 + Math.round(raw * 0.37);
          else if (/(jogo|game|rom)/i.test(text)) overall = 46 + Math.round(raw * 0.47);
          overall = Math.max(loadingProgress, Math.min(93, overall));
          if (overall === loadingProgress && raw < 100) return;
          loadingProgress = overall;
          notify("loading", text.slice(0, 140), { progress: overall });
        });
        loadingObserver.observe(document.getElementById("game"), { childList: true, characterData: true, subtree: true });

        // Alguns cores recriam os GainNodes do OpenAL depois de setVolume(),
        // fazendo o volume voltar ao máximo. Interceptar apenas conexões feitas
        // ao destination cria um ganho mestre estável para todo o áudio do core.
        const installMasterVolume = () => {
          const prototype = window.AudioNode?.prototype;
          const originalConnect = prototype?.connect;
          if (!prototype || typeof originalConnect !== "function" || prototype.__noLostVolumeInstalled) return;
          Object.defineProperty(prototype, "__noLostVolumeInstalled", { value: true });
          const gainsByContext = new WeakMap();

          prototype.connect = function(destination, ...args) {
            const context = this.context;
            if (context && destination === context.destination) {
              let master = gainsByContext.get(context);
              if (!master) {
                master = context.createGain();
                master.gain.value = desiredVolume;
                originalConnect.call(master, context.destination);
                gainsByContext.set(context, master);
                masterVolumeGains.add(master);
                queueMicrotask(() => applyMasterVolume(desiredVolume));
              }
              return originalConnect.call(this, master, ...args);
            }
            return originalConnect.call(this, destination, ...args);
          };
        };

        const applyMasterVolume = (volume) => {
          desiredVolume = Math.min(1, Math.max(0, Number(volume) || 0));
          masterVolumeGains.forEach((gain) => {
            try {
              gain.gain.cancelScheduledValues(gain.context.currentTime);
              gain.gain.setValueAtTime(desiredVolume, gain.context.currentTime);
            } catch {
              gain.gain.value = desiredVolume;
            }
          });

          const emulator = window.EJS_emulator;
          if (emulator?.setVolume) {
            // Mantém os ganhos internos em unidade; o ganho mestre aplica o
            // valor uma única vez e também alcança fontes criadas depois.
            emulator.setVolume(masterVolumeGains.size ? 1 : desiredVolume);
            emulator.volume = desiredVolume;
            emulator.muted = desiredVolume === 0;
          }
          if (desiredVolume > 0) emulator?.Module?.AL?.currentCtx?.audioCtx?.resume?.().catch?.(() => undefined);
        };

        installMasterVolume();

        const shutdownEmulator = () => {
          const emulator = window.EJS_emulator;
          if (!emulator || shuttingDown) return;
          shuttingDown = true;

          // Silencia imediatamente e encerra o loop antes que o documento suma.
          // pagehide também cobre fechamento de aba e navegação com bfcache.
          try { applyMasterVolume(0); } catch (error) { console.warn(error); }
          try { emulator.pause?.(true); } catch (error) { console.warn(error); }
          try { emulator.gameManager?.toggleMainLoop?.(0); } catch (error) { console.warn(error); }
          try { emulator.Module?.AL?.currentCtx?.audioCtx?.suspend?.(); } catch (error) { console.warn(error); }
          try { emulator.netplay?.leaveRoom?.(); } catch (error) { console.warn(error); }
          try { emulator.callEvent?.("exit"); } catch (error) { console.warn(error); }
        };

        const syncPageVisibility = () => {
          const emulator = window.EJS_emulator;
          if (!emulator || shuttingDown) return;

          // O host precisa continuar executando o jogo para transmitir áudio,
          // vídeo e receber os comandos dos convidados quando troca de aba.
          if (emulator.isNetplay) {
            pausedInBackground = false;
            return;
          }

          if (document.hidden && !emulator.paused) {
            emulator.pause?.(true);
            pausedInBackground = true;
          } else if (!document.hidden && pausedInBackground) {
            emulator.play?.(true);
            pausedInBackground = false;
          }
        };

        // O EmulatorJS escuta teclado apenas no contêiner do player. Quando o
        // popup de remapeamento move o foco para o documento, a tecla não chega
        // ao listener original. A captura no documento encaminha somente a
        // tecla que está sendo configurada e não interfere durante o jogo.
        const captureKeyboardRemap = (event) => {
          const emulator = window.EJS_emulator;
          const popup = emulator?.controlPopup?.parentElement?.parentElement;
          if (!popup || popup.hasAttribute("hidden") || event.isComposing) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          emulator.keyChange?.(event);
        };

        // O documento do iframe é quem recebe o teclado enquanto o canvas está
        // focado. Encaminhamos a entrada bruta ao InputManager do React, que é a
        // única camada responsável por mapear e acionar o core.
        const captureExternalKeyboard = (event) => {
          if (!externalInputEnabled || event.isComposing || event.metaKey || event.ctrlKey || event.altKey) return;
          const emulator = window.EJS_emulator;
          const popup = emulator?.controlPopup?.parentElement?.parentElement;
          if (popup && !popup.hasAttribute("hidden")) return;
          if (!externalKeyboardCodes.has(event.code)) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          notify("keyboard-input", "", { code: event.code, pressed: event.type === "keydown", repeat: event.repeat });
        };

        if (!core || !rom) {
          fail("Os parâmetros do emulador estão incompletos.");
          return;
        }

        // Se a ROM for do Archive.org e ainda não foi roteada pelo proxy, converte automaticamente
        if (/^https?:\/\/(?:[a-z0-9-]+\.)*archive\.org\//i.test(rom)) {
          let cleanRom = rom;
          while (cleanRom.includes("%25")) {
            try { cleanRom = decodeURIComponent(cleanRom); } catch { break; }
          }
          let cleanFileName = "rom.zip";
          try {
            const parsed = new URL(cleanRom);
            parsed.pathname = parsed.pathname
              .split("/")
              .map((seg) => encodeURIComponent(decodeURIComponent(seg)))
              .join("/");
            cleanRom = parsed.toString();
            const last = parsed.pathname.split("/").filter(Boolean).pop();
            if (last) cleanFileName = decodeURIComponent(last);
          } catch {
            // fallback
          }
          rom = `/api/rom?v=5&url=${encodeURIComponent(cleanRom)}#/${encodeURIComponent(cleanFileName)}`;
        } else if ((rom.includes("/api/rom") || rom.includes("/api/proxy")) && !rom.includes("#/")) {
          try {
            const parsed = new URL(rom, window.location.origin);
            const targetUrl = parsed.searchParams.get("url");
            if (targetUrl) {
              let cleanTarget = targetUrl;
              while (cleanTarget.includes("%25")) {
                try { cleanTarget = decodeURIComponent(cleanTarget); } catch { break; }
              }
              const targetParsed = new URL(cleanTarget);
              const last = targetParsed.pathname.split("/").filter(Boolean).pop();
              if (last) {
                rom = `${rom}#/${encodeURIComponent(decodeURIComponent(last))}`;
              }
            }
          } catch {
            // fallback
          }
        }

        // Interceptador para garantir descompactação de qualquer ROM em arquivo .zip/.7z/.rar
        let _internalEmulator = null;
        Object.defineProperty(window, "EJS_emulator", {
          configurable: true,
          enumerable: true,
          get: () => _internalEmulator,
          set: (instance) => {
            _internalEmulator = instance;
            if (instance && instance.storageCache && typeof instance.storageCache.download === "function") {
              const originalDownload = instance.storageCache.download.bind(instance.storageCache);
              instance.storageCache.download = function (
                url,
                type,
                onProgress,
                onComplete,
                timeout,
                responseType,
                forceExtract,
                dontCache,
                dontExtract,
              ) {
                let shouldExtract = forceExtract;
                const lower = String(url || "").toLowerCase();
                if (lower.includes(".zip") || lower.includes(".7z") || lower.includes(".rar")) {
                  shouldExtract = true;
                }
                return originalDownload(
                  url,
                  type,
                  onProgress,
                  onComplete,
                  timeout,
                  responseType,
                  shouldExtract,
                  dontCache,
                  dontExtract,
                );
              };
            }
          },
        });

        if (/^https?:/i.test(rom)) {
          try {
            const romConnection = document.createElement("link");
            romConnection.rel = "preconnect";
            romConnection.href = new URL(rom).origin;
            romConnection.crossOrigin = "anonymous";
            document.head.appendChild(romConnection);
          } catch {
            fail("A URL da ROM não é válida.");
            return;
          }
        }

        // Mupen64Plus requer WebGL 2. ParaLLEl é a alternativa para GPUs/drivers
        // que só oferecem WebGL 1 e que, de outra forma, exibiriam apenas uma tela preta.
        if (core === "mupen64plus_next") {
          const supportsWebGl2 = Boolean(document.createElement("canvas").getContext("webgl2"));
          if (!supportsWebGl2) {
            core = "parallel_n64";
            notify("loading", "Usando o núcleo N64 de compatibilidade…", { progress: 18 });
          }
        }

        window.addEventListener("message", async (event) => {
          if (event.source !== window.parent || event.origin !== window.location.origin) return;
          const data = event.data;
          if (data?.source !== "no-lost-player") return;

          if (data.type === "shutdown") {
            shutdownEmulator();
            return;
          }

          if (data.type === "configure-input") {
            externalInputEnabled = true;
            externalKeyboardCodes = new Set(Array.isArray(data.codes) ? data.codes.filter((code) => typeof code === "string") : []);
            const emulator = window.EJS_emulator;
            if (emulator) {
              emulator.toggleVirtualGamepad?.(false);
              if (Array.isArray(emulator.gamepadSelection)) emulator.gamepadSelection.fill("");
            }
            return;
          }

          if (data.type === "set-volume") {
            applyMasterVolume(data.volume);
            return;
          }

          if (data.type === "set-fast-forward") {
            const emulator = window.EJS_emulator;
            if (!emulator?.gameManager) return;
            const active = data.active === true;
            emulator.gameManager.setFastForwardRatio?.(2);
            emulator.gameManager.toggleFastForward?.(active ? 1 : 0);
            emulator.isFastForward = active;
            return;
          }

          if (data.type === "set-paused") {
            const emulator = window.EJS_emulator;
            if (!emulator?.gameManager) return;
            if (data.paused === true) emulator.pause?.(true);
            else emulator.play?.(true);
            return;
          }

          if (data.type === "input") {
            const emulator = window.EJS_emulator;
            const coreIndex = Number(data.coreIndex);
            const rawValue = Math.min(1, Math.max(0, Number(data.value) || 0));
            if (!emulator?.gameManager || !Number.isInteger(coreIndex) || coreIndex < 0 || coreIndex > 29) return;
            if (Array.isArray(emulator.gamepadSelection)) emulator.gamepadSelection.fill("");
            const value = emulator.analogAxes?.includes(coreIndex) ? Math.round(rawValue * 0x7fff) : (rawValue >= 0.5 ? 1 : 0);
            emulator.gameManager.simulateInput(0, coreIndex, value);
            return;
          }

          if (data.type === "release-all-inputs") {
            const emulator = window.EJS_emulator;
            if (!emulator?.gameManager) return;
            for (let index = 0; index < 30; index += 1) emulator.gameManager.simulateInput(0, index, 0);
            return;
          }

          if (typeof data.requestId !== "string") return;

          try {
            const emulator = window.EJS_emulator;
            const gameManager = emulator?.gameManager;
            if (!gameManager) throw new Error("Aguarde o jogo terminar de iniciar.");

            if (data.type === "open-controls") {
              if (!emulator.controlMenu) throw new Error("O menu de controles ainda não está disponível.");
              emulator.controlMenu.style.display = "";
              emulator.elements?.parent?.setAttribute?.("tabindex", "-1");
              emulator.elements?.parent?.focus?.({ preventScroll: true });
              notify("controls-opened", "Configuração de controles aberta", { requestId: data.requestId });
            } else if (data.type === "open-netplay") {
              if (!netplayServer || !Number.isSafeInteger(gameId) || gameId <= 0) {
                throw new Error("O servidor de salas online não está configurado.");
              }
              if (!emulator.netplay) throw new Error("Este emulador não oferece jogo online.");
              const controller = new AbortController();
              const timeout = window.setTimeout(() => controller.abort(), 75000);
              try {
                const healthUrl = `${netplayServer.replace(/\/+$/, "")}/games`;
                const response = await fetch(healthUrl, { signal: controller.signal });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
              } catch {
                throw new Error("O servidor das salas online está indisponível. Aguarde um momento e tente novamente.");
              } finally {
                window.clearTimeout(timeout);
              }
              if (!emulator.netplay.isMenuCreated()) emulator.netplay.createNetplayMenu();
              emulator.netplay.openMenu();
              notify("netplay-opened", "Salas online abertas", { requestId: data.requestId });
            } else if (data.type === "export-state") {
              if (!gameManager.supportsStates()) throw new Error("Este núcleo não oferece salvamento de estado.");
              const state = gameManager.getState();
              const stateBuffer = state instanceof Uint8Array
                ? state.slice().buffer
                : new Uint8Array(state).slice().buffer;
              notify("state-exported", "Estado exportado", { requestId: data.requestId, state: stateBuffer }, [stateBuffer]);
            } else if (data.type === "import-state") {
              if (!(data.state instanceof ArrayBuffer)) throw new Error("O arquivo de salvamento é inválido.");
              gameManager.loadState(new Uint8Array(data.state));
              notify("state-imported", "Estado carregado", { requestId: data.requestId });
            }
          } catch (error) {
            notify(
              "command-error",
              error instanceof Error ? error.message : "Falha ao acessar o salvamento.",
              { requestId: data.requestId },
            );
          }
        });

        window.addEventListener("pagehide", shutdownEmulator);
        document.addEventListener("visibilitychange", syncPageVisibility);
        document.addEventListener("keydown", captureKeyboardRemap, true);
        document.addEventListener("keydown", captureExternalKeyboard, true);
        document.addEventListener("keyup", captureExternalKeyboard, true);

        window.addEventListener("error", (event) => {
          if (event.message) fail("O EmulatorJS encontrou um erro ao carregar o jogo.");
        });
        window.addEventListener("unhandledrejection", (event) => {
          const detail = event.reason instanceof Error
            ? event.reason.message
            : typeof event.reason === "string" ? event.reason : "erro interno sem detalhes";

          // O EmulatorJS solicita um Wake Lock durante a inicialização. Chrome
          // rejeita a solicitação quando o jogo é aberto em uma aba de fundo,
          // mas isso não impede a ROM ou o core de continuarem carregando.
          if (/wake\s?lock/i.test(detail) && /(not visible|not active|visibility)/i.test(detail)) {
            event.preventDefault();
            console.warn("Wake Lock indisponível enquanto a aba está em segundo plano.");
            return;
          }

          console.error("Falha não tratada no EmulatorJS:", event.reason);
          fail(`A ROM não pôde ser carregada. Detalhe: ${detail}`);
        });

        const start = () => {
          notify("loading", "Carregando o runtime do console…", { progress: 4 });
          window.EJS_player = "#game";
          window.EJS_core = core;
          window.EJS_gameUrl = rom;
          window.EJS_gameName = name;
          window.EJS_volume = desiredVolume;
          if (Number.isSafeInteger(gameId) && gameId > 0) window.EJS_gameID = gameId;
          // O netplay está disponível a partir do 4.3.0-pre. Essa versão também
          // contém a correção do PCSX-ReARMed usada pelos jogos japoneses.
          const emulatorVersion = "4.3.0-pre";
          window.EJS_pathtodata = `https://cdn.emulatorjs.org/${emulatorVersion}/data/`;
          window.EJS_cacheConfig = {
            enabled: true,
            cacheMaxSizeMB: 4096,
            cacheMaxAgeMins: 43200,
          };
          // O core com threads reduz o tempo de inicialização e melhora a
          // estabilidade do PS1 depois que a imagem do disco é descompactada.
          window.EJS_threads = core === "pcsx_rearmed" && window.crossOriginIsolated;
          if (netplayServer && Number.isSafeInteger(gameId) && gameId > 0) {
            window.EJS_netplayServer = netplayServer;
            window.EJS_netplayICEServers = [
              { urls: "stun:stun.l.google.com:19302" },
              { urls: "stun:stun1.l.google.com:19302" },
              { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
              { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" },
            ];
          }
          const defaultOptions = {};
          // O build pre nao publica os relatorios dos cores N64; sem esta
          // preferencia eles caem no build WebGL 1 legado e podem abortar.
          if (core === "mupen64plus_next" || core === "parallel_n64" || core === "pcsx_rearmed") {
            defaultOptions.webgl2Enabled = "enabled";
          }
          if (core === "pcsx_rearmed") {
            // Sem uma BIOS oficial fornecida pelo usuário, força a BIOS HLE do core.
            // O modo Auto de builds antigos pode selecionar uma região incorreta.
            defaultOptions.pcsx_rearmed_bios = "HLE";
          }
          window.EJS_defaultOptions = defaultOptions;
          window.EJS_startOnLoaded = true;
          window.EJS_backgroundColor = "#050609";
          window.EJS_color = "#8b6cff";
          // A barra externa já oferece estas ações com a identidade visual do
          // app. Mantemos na barra nativa apenas recursos exclusivos, como
          // cheats, ajustes avançados, opções do core, discos e saves .sav.
          window.EJS_Buttons = {
            playPause: false,
            restart: false,
            mute: false,
            unmute: false,
            volumeSlider: false,
            fullscreen: false,
            saveState: false,
            loadState: false,
            quickSave: false,
            quickLoad: false,
            gamepad: false,
            netplay: false,
            exitEmulation: false,
          };
          window.EJS_onGameStart = () => {
            loadingObserver.disconnect();
            const emulator = window.EJS_emulator;
            emulator.toggleVirtualGamepad?.(false);
            if (emulator.virtualGamepad) emulator.virtualGamepad.style.setProperty("display", "none", "important");
            if (Array.isArray(emulator.gamepadSelection)) emulator.gamepadSelection.fill("");
            // Evita que o polling nativo injete uma segunda entrada em paralelo
            // com o InputManager da aplicação.
            if (externalInputEnabled) emulator.gamepad?.terminate?.();
            applyMasterVolume(desiredVolume);
            notify("ready", "Jogo iniciado");
            syncPageVisibility();
          };

          const loader = document.createElement("script");
          loader.src = `${window.EJS_pathtodata}loader.js`;
          loader.async = true;
          loader.onload = () => {
            notify("loading", "Runtime carregado. Baixando núcleo e jogo…", { progress: 8 });
          };
          loader.onerror = () => {
            fail("Não foi possível baixar o EmulatorJS. Verifique sua conexão com a internet.");
          };
          document.body.appendChild(loader);
        };

        start();
      })();
    </script>
  </body>
</html>
